name: Build Android APK & Windows PC App

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Web Bundle & Sync Capacitor Android
        working-directory: mobile-app
        run: |
          npm ci
          npm run sync:android

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nexus-release.keystore" \
            -alias nexus \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass nexusdeck123 \
            -keypass nexusdeck123 \
            -dname "CN=NEXUS Deck, OU=Mobile, O=NEXUS, L=City, S=State, C=US"

      - name: Assemble Signed Android APK
        working-directory: mobile-app/android
        env:
          NEXUS_KEYSTORE_PATH: ${{ runner.temp }}/nexus-release.keystore
          NEXUS_KEYSTORE_PASSWORD: nexusdeck123
          NEXUS_KEY_ALIAS: nexus
          NEXUS_KEY_PASSWORD: nexusdeck123
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NEXUS-Mobile-Android.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Mobile-Android
          path: NEXUS-Mobile-Android.apk
          if-no-files-found: error

  build-pc:
    name: Build Windows PC App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pc-app/package-lock.json

      - name: Build & Package Windows Portable EXE
        working-directory: pc-app
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist:win
          Copy-Item "release/NEXUS-PC-Windows.exe" "$env:GITHUB_WORKSPACE/NEXUS-PC-Windows.exe"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-PC-Windows
          path: NEXUS-PC-Windows.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-android, build-pc]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'NEXUS Deck — Latest Build' }}
          make_latest: true
          files: |
            artifacts/NEXUS-Mobile-Android.apk
            artifacts/NEXUS-PC-Windows.exe
          body: |
            Скачайте готовые сборки:
            - **На Android:** `NEXUS-Mobile-Android.apk`
            - **На ПК (Windows):** `NEXUS-PC-Windows.exe`
